<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cubito</title>
    <style>
      /* Every colour here is a --cubito-* custom property written at startup by
         applyCssTheme(); no hex literal may appear in this file or any DOM module. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: var(--cubito-background);
        color: var(--cubito-text-primary);
        font-family: 'Fira Code', 'SF Mono', ui-monospace, 'Cascadia Code', monospace;
        overflow: hidden;
      }
      /* Compare side panel (design compare-side-panel §4) — layout tokens only, never touched by
         applyCssTheme(); 0 while closed keeps every calc() below valid. */
      :root {
        --cubito-compare-panel-width: 0px;
        --cubito-compare-header-h: 84px; /* the 3-line compare HUD, matching .cubito-diff-panel's top */
        --cubito-compare-child-rail-w: 200px;
        --cubito-compare-file-rail-w: 200px;
        --cubito-system-feed-w: 0px;
      }
      body[data-system-panel='open'] {
        --cubito-system-feed-w: 400px;
      }
      body[data-compare-panel='open'] {
        --cubito-compare-panel-width: clamp(520px, 52vw, 880px);
      }
      #app {
        position: relative;
        height: 100%;
        width: calc(100% - var(--cubito-compare-panel-width));
        /* CSS2DRenderer never clips its children, so a node label near the right edge would
           paint over the panel (and, before this, over the HUD). */
        overflow: hidden;
        /* CSS2DRenderer stacks labels/panels with large z-indexes; contain them so #hud (z-index 1)
           always paints above. */
        isolation: isolate;
      }
      /* Vignette (design §7.5): the mockup's vignette is a gradient, so CSS reproduces it
         pixel-exactly at zero scene cost. */
      #vignette {
        position: fixed;
        inset: 0 var(--cubito-compare-panel-width) 0 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          transparent 0%,
          var(--cubito-vignette-edge) 90%
        );
      }
      #hud {
        position: fixed;
        inset: 12px 16px auto 16px;
        z-index: 1; /* own stacking context above #app's positioned CSS2D node labels */
        font-size: 12px;
        line-height: 1.6;
        pointer-events: none;
      }
      .cubito-hud__line--glow {
        text-shadow: 0 0 8px var(--cubito-accent);
      }
      .cubito-hud__line--notice {
        color: var(--cubito-amber-ink);
      }
      .cubito-hud__dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 8px;
        border-radius: 50%;
        vertical-align: middle;
      }
      /* Any class-level `display` beats the UA's [hidden] rule — main.ts hides chrome via `el.hidden`. */
      [hidden] {
        display: none !important;
      }
      .cubito-demo-banner {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        max-width: calc(100% - 32px);
        padding: 6px 14px;
        border: 1px solid var(--cubito-amber);
        border-radius: 0 0 6px 6px;
        background: var(--cubito-background);
        color: var(--cubito-amber);
        font-size: 12px;
        font-weight: 600;
        text-align: center;
        pointer-events: none;
      }
      .cubito-toast-stack {
        position: fixed;
        top: 14px;
        /* Toast lane: stays left of the docked side panels so it never covers their headers. */
        right: calc(16px + var(--cubito-compare-panel-width) + var(--cubito-system-feed-w));
        z-index: 3;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(360px, calc(100% - 32px));
        pointer-events: none;
      }
      .cubito-toast {
        padding: 8px 12px;
        border: 1px solid var(--cubito-panel-border);
        border-radius: 6px;
        background: var(--cubito-panel-surface);
        color: var(--cubito-text-primary);
        font-size: 12px;
        line-height: 1.45;
        cursor: pointer;
        pointer-events: auto;
      }
      .cubito-toast[data-state='blocked'],
      .cubito-toast[data-state='waiting'] {
        border-color: var(--cubito-amber);
      }
      .cubito-toast__title {
        font-weight: 600;
      }
      .cubito-toast[data-state='blocked'] .cubito-toast__title,
      .cubito-toast[data-state='waiting'] .cubito-toast__title {
        color: var(--cubito-amber);
      }
      .cubito-toast__body {
        color: var(--cubito-text-dim);
        overflow-wrap: anywhere;
      }
      #keyboard-bar {
        position: fixed;
        left: 16px;
        bottom: 14px;
        pointer-events: none;
      }
      .cubito-keyboard-bar {
        display: flex;
        gap: 14px;
        font-size: 11px;
        color: var(--cubito-text-dim);
      }
      .cubito-keychip__key {
        display: inline-block;
        padding: 2px 6px;
        margin-right: 6px;
        border: 1px solid var(--cubito-panel-border);
        border-radius: 4px;
        background: var(--cubito-panel-surface);
        color: var(--cubito-key-chip);
      }
      .cubito-node-label {
        font-size: 11px;
        line-height: 1.45;
      }
      /* Terminal panel (design Area 6): 520px matches the mockup's HUD dock; the same size is
         reused in-scene so reparenting the CSS2DObject never resizes the live xterm instance. */
      .cubito-terminal-panel {
        display: flex;
        flex-direction: column;
        width: 520px;
        height: 360px;
        overflow: hidden;
        pointer-events: auto;
      }
      .cubito-terminal-panel--focused {
        border-color: var(--cubito-accent);
      }
      .cubito-terminal-panel__header {
        flex-shrink: 0;
        padding: 8px 12px;
        font-size: 12px;
      }
      .cubito-terminal-panel__body {
        flex: 1;
        min-height: 0;
        padding: 0 6px 6px;
      }
      /* Spawn radial (design Area 3/mockup Spawn.dc.html): chips float around the selected
         node's CSS2DObject; layout only here, content/tone comes from spawn-view-model.ts. */
      .cubito-spawn-menu {
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 12px;
        white-space: nowrap;
      }
      .cubito-spawn-chip {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .cubito-spawn-chip__key {
        color: var(--cubito-text-dim);
        font-size: 10px;
      }
      .cubito-spawn-chip--disabled {
        opacity: 0.6;
      }
      /* Spawn form (mockup: 420px panel, 22px padding, 6px radius, 40px field rows). */
      .cubito-spawn-form {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 420px;
        padding: 22px;
        background: var(--cubito-panel-surface);
        border: 1px solid var(--cubito-panel-border);
        border-radius: 6px;
        font-size: 12.5px;
      }
      .cubito-spawn-form__title,
      .cubito-fanout-form__title {
        font-size: 13px;
        font-weight: 500;
        color: var(--cubito-text-primary);
      }
      .cubito-spawn-form__field {
        height: 40px;
        padding: 0 12px;
        background: var(--cubito-background);
        border: 1px solid var(--cubito-panel-border);
        border-radius: 4px;
        color: var(--cubito-text-primary);
        font-family: inherit;
        font-size: 12.5px;
      }
      .cubito-spawn-form__field:focus {
        outline: none;
        border-color: var(--cubito-accent);
      }
      .cubito-spawn-form__field--prompt {
        height: 84px;
        padding: 10px 12px;
        line-height: 1.6;
        resize: none;
      }
      .cubito-spawn-form__field:disabled {
        color: var(--cubito-text-dim);
      }
      .cubito-spawn-form__submit {
        height: 40px;
        border: none;
        border-radius: 4px;
        background: var(--cubito-accent);
        color: var(--cubito-background);
        font-weight: 600;
        font-size: 12.5px;
        cursor: pointer;
      }
      .cubito-spawn-form__submit:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .cubito-spawn-form__cancel {
        height: 40px;
        border: 1px solid var(--cubito-panel-border);
        border-radius: 4px;
        background: transparent;
        color: var(--cubito-text-dim);
        font-size: 12.5px;
        cursor: pointer;
      }
      .cubito-spawn-form__error {
        font-size: 11px;
        color: var(--cubito-amber);
      }
      .cubito-spawn-form__notice,
      .cubito-fanout-form__notice,
      .cubito-project-selector__notice {
        font-size: 11px;
        color: var(--cubito-text-dim);
      }
      .cubito-spawn-form__hint {
        font-size: 10px;
        color: var(--cubito-text-faint);
        text-align: right;
      }
      /* Fan-out form/running callout (mockup Fanout.dc.html): mirrors the spawn form's 420px
         panel exactly; the callout/counters share one panel with the form fields since the
         fan-out slice has no separate radial step. Accent/amber are the mockup's own lime
         title and amber "esperando input" colours — already the same tokens, no new var. */
      .cubito-fanout-form {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 420px;
        padding: 22px;
        background: var(--cubito-panel-surface);
        border: 1px solid var(--cubito-panel-border);
        border-radius: 6px;
        font-size: 12.5px;
      }
      .cubito-fanout-form__field {
        height: 40px;
        padding: 0 12px;
        background: var(--cubito-background);
        border: 1px solid var(--cubito-panel-border);
        border-radius: 4px;
        color: var(--cubito-text-primary);
        font-family: inherit;
        font-size: 12.5px;
      }
      .cubito-fanout-form__field:focus {
        outline: none;
        border-color: var(--cubito-accent);
      }
      .cubito-fanout-form__field--prompt {
        height: 84px;
        padding: 10px 12px;
        line-height: 1.6;
        resize: none;
      }
      .cubito-fanout-form__field:disabled {
        color: var(--cubito-text-dim);
      }
      .cubito-fanout-form__submit {
        height: 40px;
        border: none;
        border-radius: 4px;
        background: var(--cubito-accent);
        color: var(--cubito-background);
        font-weight: 600;
        font-size: 12.5px;
        cursor: pointer;
      }
      .cubito-fanout-form__submit:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .cubito-fanout-form__cancel {
        height: 40px;
        border: 1px solid var(--cubito-panel-border);
        border-radius: 4px;
        background: transparent;
        color: var(--cubito-text-dim);
        font-size: 12.5px;
        cursor: pointer;
      }
      .cubito-fanout-form__error {
        font-size: 11px;
        color: var(--cubito-amber);
      }
      .cubito-fanout-form__callout {
        font-size: 12px;
        font-weight: 500;
        color: var(--cubito-accent);
      }
      .cubito-fanout-form__counters {
        font-size: 11px;
        color: var(--cubito-text-dim);
      }
      .cubito-fanout-form__failures {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .cubito-fanout-form__failure {
        font-size: 11px;
        color: var(--cubito-amber);
      }
      /* Interactive gate/question rows (Change F): mounted inside the fan-out running panel,
         below the counters line — one row per PENDING gate/question, same field styling as the
         form fields above. */
      .cubito-decision-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .cubito-decision-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-top: 10px;
        border-top: 1px solid var(--cubito-panel-border);
      }
      .cubito-decision-row__question {
        font-size: 11.5px;
        color: var(--cubito-text-primary);
      }
      .cubito-decision-row__select,
      .cubito-decision-row__textarea {
        padding: 8px 10px;
        background: var(--cubito-background);
        border: 1px solid var(--cubito-panel-border);
        border-radius: 4px;
        color: var(--cubito-text-primary);
        font-family: inherit;
        font-size: 12px;
      }
      .cubito-decision-row__textarea {
        min-height: 56px;
        line-height: 1.5;
        resize: none;
      }
      .cubito-decision-row__submit {
        align-self: flex-start;
        height: 32px;
        padding: 0 14px;
        border: none;
        border-radius: 4px;
        background: var(--cubito-accent);
        color: var(--cubito-background);
        font-weight: 600;
        font-size: 11.5px;
        cursor: pointer;
      }
      .cubito-decision-row__submit:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .cubito-decision-row__error {
        font-size: 11px;
        color: var(--cubito-amber);
      }
      /* Project selector (design Area 4/PROJ-005/006): command-palette panel — query input, repo
         rows, trailing "+ agregar repo" row, and the add-form, sized like the spawn form. */
      .cubito-project-selector {
        display: flex;
        flex-direction: column;
        width: 420px;
        padding: 18px;
        background: var(--cubito-panel-surface);
        border: 1px solid var(--cubito-panel-border);
        border-radius: 6px;
        font-size: 12.5px;
      }
      .cubito-project-selector__list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .cubito-project-selector__query {
        height: 36px;
        padding: 0 12px;
        background: var(--cubito-background);
        border: 1px solid var(--cubito-panel-border);
        border-radius: 4px;
        color: var(--cubito-text-primary);
        font-family: inherit;
        font-size: 12.5px;
      }
      .cubito-project-selector__query:focus {
        outline: none;
        border-color: var(--cubito-accent);
      }
      .cubito-project-selector__rows {
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-height: 220px;
        overflow-y: auto;
      }
      .cubito-project-selector__row {
        padding: 8px 10px;
        border-radius: 4px;
        color: var(--cubito-text-dim);
        cursor: pointer;
      }
      .cubito-project-selector__row--active {
        color: var(--cubito-text-primary);
      }
      .cubito-project-selector__row--highlighted {
        background: var(--cubito-panel-border);
        color: var(--cubito-text-primary);
      }
      .cubito-project-selector__row--add {
        color: var(--cubito-accent);
      }
      .cubito-project-selector__form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .cubito-project-selector__field {
        height: 40px;
        padding: 0 12px;
        background: var(--cubito-background);
        border: 1px solid var(--cubito-panel-border);
        border-radius: 4px;
        color: var(--cubito-text-primary);
        font-family: inherit;
        font-size: 12.5px;
      }
      .cubito-project-selector__field:focus {
        outline: none;
        border-color: var(--cubito-accent);
      }
      .cubito-project-selector__submit {
        height: 40px;
        border: none;
        border-radius: 4px;
        background: var(--cubito-accent);
        color: var(--cubito-background);
        font-weight: 600;
        font-size: 12.5px;
        cursor: pointer;
      }
      .cubito-project-selector__submit:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .cubito-project-selector__cancel {
        height: 40px;
        border: 1px solid var(--cubito-panel-border);
        border-radius: 4px;
        background: transparent;
        color: var(--cubito-text-dim);
        font-size: 12.5px;
        cursor: pointer;
      }
      .cubito-project-selector__error {
        font-size: 11px;
        color: var(--cubito-amber);
      }
      /* Command palette (design Area 4/6, ⌘K/Ctrl+K): unlike the selector/spawn panels, this
         mounts into #hud — a fixed top strip — but must render as a centered modal over the
         whole scene, so it owns its own fixed positioning and a dimming/blurring backdrop. */
      .cubito-command-palette {
        position: fixed;
        inset: 0;
        z-index: 20;
      }
      .cubito-command-palette__backdrop {
        position: fixed;
        inset: 0;
        background: color-mix(in srgb, var(--cubito-background) 70%, transparent);
        backdrop-filter: blur(4px);
        pointer-events: auto;
      }
      .cubito-command-palette__panel {
        position: fixed;
        top: 150px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        width: 640px;
        padding: 18px;
        background: var(--cubito-panel-surface);
        border: 1px solid var(--cubito-panel-border);
        border-radius: 6px;
        font-size: 12.5px;
      }
      .cubito-command-palette__header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 12px;
      }
      .cubito-command-palette__prompt {
        color: var(--cubito-accent);
      }
      .cubito-command-palette__query {
        flex: 1;
        height: 32px;
        border: none;
        background: transparent;
        color: var(--cubito-text-primary);
        font-family: inherit;
        font-size: 13px;
      }
      .cubito-command-palette__query:focus {
        outline: none;
      }
      .cubito-command-palette__rows {
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-height: 320px;
        overflow-y: auto;
      }
      .cubito-command-palette__row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 10px;
        border-radius: 4px;
        color: var(--cubito-text-dim);
        cursor: pointer;
      }
      .cubito-command-palette__row--highlighted {
        background: color-mix(in srgb, var(--cubito-accent) 8%, transparent);
        color: var(--cubito-text-primary);
      }
      .cubito-command-palette__row--disabled {
        color: var(--cubito-text-faint);
        cursor: default;
      }
      .cubito-command-palette__keycap {
        padding: 2px 6px;
        border: 1px solid var(--cubito-panel-border);
        border-radius: 4px;
        color: var(--cubito-key-chip);
        font-size: 10px;
      }
      .cubito-command-palette__footer {
        padding-top: 12px;
        color: var(--cubito-text-faint);
        font-size: 10.5px;
      }
      .pulse {
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -24;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse {
          animation: none;
        }
        .system-edge--flow,
        .system-node--editing .system-node__shape {
          animation: none;
        }
      }
      /* Sistema en vivo (design: VistaSistema.dc.html) — the mode's own HUD block, mounted
         separately from #hud since it is not the mode-aware shared worktree HUD. */
      #system {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .cubito-system-hud {
        position: absolute;
        inset: 12px 16px auto 16px;
        font-size: 12px;
        line-height: 1.6;
        pointer-events: none;
      }
      .cubito-system-hud__label {
        color: var(--cubito-info);
      }
      /* Scrollable slot the graph SVG mounts into (Change item 4) — narrower than 832px scrolls
         instead of shrinking node labels past legibility. */
      .cubito-system-graph-viewport {
        position: absolute;
        left: 0;
        top: 84px; /* the 3-line HUD ends ~70px; reserved here so it survives the viewBox scale */
        width: calc(100% - var(--cubito-system-feed-w));
        max-width: 1040px;
        height: calc(100% - 84px);
        overflow-x: auto;
        overflow-y: hidden;
        pointer-events: auto; /* #system itself is pointer-events:none */
      }
      /* The slot is static markup: with [x] closed it is empty and must not shadow the scene. */
      .cubito-system-graph-viewport:empty {
        pointer-events: none;
      }
      /* System graph SVG: nodes are <g>s carrying system-node--<kind>/--<state> from
         system-graph-model.ts; edges are <line>s carrying system-edge--<kind>. */
      .cubito-system-graph {
        display: block;
        width: 100%;
        min-width: 832px; /* 0.8 × 1040 — scale floor before the viewport scrolls instead of shrinking further */
        max-width: 1040px; /* the model's design canvas: never upscale, only shrink to fit */
        height: 100%;
      }
      .system-node__shape {
        fill: var(--cubito-panel-surface);
        stroke: var(--cubito-panel-border);
      }
      .system-node__label {
        fill: var(--cubito-text-primary);
        font-size: 12px;
      }
      .system-node--endpoint .system-node__label,
      .system-node--service .system-node__label,
      .system-node--database .system-node__label {
        fill: var(--cubito-key-chip);
      }
      .system-node__method {
        fill: var(--cubito-text-dim);
        font-weight: 600;
        font-size: 11px;
      }
      .system-node__diff {
        fill: var(--cubito-amber-ink);
        font-size: 10px;
      }
      .system-node__note {
        fill: var(--cubito-info);
        font-size: 10px;
      }
      /* editing: glowing solid border + the shared pulse (reused, not reimplemented). */
      .system-node--editing .system-node__shape {
        stroke: var(--cubito-active-faces-right);
        stroke-width: 1.5;
        filter: drop-shadow(0 0 6px var(--cubito-active-faces-right));
        animation: pulse 1.6s ease-in-out infinite;
      }
      /* naciendo: dashed outline — the node the agent just created. Opaque fill so edges
         ending on it stay hidden behind the box like every other state. */
      .system-node--naciendo .system-node__shape {
        fill: var(--cubito-panel-surface);
        stroke: var(--cubito-active-faces-right);
        stroke-dasharray: 5 4;
        stroke-opacity: 0.8;
      }
      /* dirty service: faintly lit, downstream of the endpoint being edited. */
      .system-node--service.system-node--dirty .system-node__shape {
        stroke: var(--cubito-active-faces-right);
        stroke-opacity: 0.5;
      }
      .system-node--tested .system-node__shape {
        stroke: var(--cubito-accent);
      }
      .system-node--highlighted .system-node__shape {
        stroke: var(--cubito-accent);
      }
      .system-edge--normal {
        stroke: var(--cubito-edge-normal);
        stroke-width: 1.5;
        opacity: 0.8;
      }
      .system-edge--flow {
        stroke: var(--cubito-active-faces-right);
        stroke-width: 2;
        stroke-dasharray: 6 6;
        opacity: 0.7;
        animation: flow 1.2s linear infinite;
      }
      .system-edge--faint {
        stroke: var(--cubito-active-faces-right);
        stroke-width: 1;
        stroke-dasharray: 3 5;
        opacity: 0.4;
      }
      /* Activity feed (design: right-panel "actividad del agente" dock, 400px). */
      .cubito-activity-feed {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: var(--cubito-system-feed-w);
        display: flex;
        flex-direction: column;
        background: var(--cubito-panel-surface);
        border-left: 1px solid var(--cubito-panel-border);
      }
      .cubito-activity-feed__header {
        padding: 14px 18px;
        border-bottom: 1px solid var(--cubito-panel-border);
      }
      .cubito-activity-feed__title {
        font-size: 13px;
        font-weight: 500;
        color: var(--cubito-text-primary);
      }
      .cubito-activity-feed__subtitle {
        font-size: 11px;
        color: var(--cubito-text-dim);
        margin-top: 4px;
      }
      .cubito-activity-feed__rows {
        flex: 1;
        padding: 14px 18px;
        font-size: 11.5px;
        line-height: 1.9;
        color: var(--cubito-key-chip);
        overflow: hidden;
      }
      .cubito-activity-feed__row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .cubito-activity-feed__row--highlighted {
        background: color-mix(in srgb, var(--cubito-info) 7%, transparent);
        margin: 2px -18px;
        padding: 2px 18px;
      }
      .cubito-activity-feed__time {
        color: var(--cubito-text-faint);
      }
      .cubito-activity-feed__text {
        color: var(--cubito-text-primary);
      }
      .cubito-activity-feed__detail {
        flex-basis: 100%;
        padding-left: 20px;
        color: var(--cubito-text-dim);
      }
      .activity-row--read .cubito-activity-feed__glyph,
      .activity-row--edit .cubito-activity-feed__glyph,
      .activity-row--create .cubito-activity-feed__glyph {
        color: var(--cubito-info);
      }
      .activity-row--run .cubito-activity-feed__glyph {
        color: var(--cubito-key-chip);
      }
      .activity-row--pass .cubito-activity-feed__glyph {
        color: var(--cubito-accent);
      }
      .activity-row--diff .cubito-activity-feed__glyph {
        color: var(--cubito-amber-ink);
      }
      .cubito-activity-feed__footer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 18px;
        border-top: 1px solid var(--cubito-panel-border);
        color: var(--cubito-text-dim);
        font-size: 11.5px;
      }
      .cubito-activity-feed__cursor {
        color: var(--cubito-info);
        font-size: 12px;
      }
      /* Diff (design camada) — own full-screen mode, mirrors #system's layout shape: a fixed
         rail on the left, the line-diff panel filling the rest. Cubito is red-free: additions
         use the green accent, deletions use amber (never a red token). */
      #diff {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .cubito-diff-hud {
        position: absolute;
        inset: 12px 16px auto 256px;
        font-size: 12px;
        line-height: 1.6;
        pointer-events: none;
      }
      .cubito-diff-rail {
        position: absolute;
        left: 0;
        top: 0;
        width: 240px;
        height: 100%;
        overflow-y: auto;
        background: var(--cubito-panel-surface);
        border-right: 1px solid var(--cubito-panel-border);
        font-size: 11.5px;
        pointer-events: auto;
      }
      .cubito-diff-rail__empty {
        padding: 14px 16px;
        color: var(--cubito-text-faint);
      }
      .cubito-diff-rail__error {
        padding: 14px 16px;
        color: var(--cubito-amber-ink);
      }
      .diff-rail__row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        cursor: pointer;
        border-bottom: 1px solid var(--cubito-panel-border);
        color: var(--cubito-text-dim);
      }
      .diff-rail__row--selected {
        background: color-mix(in srgb, var(--cubito-info) 8%, transparent);
        color: var(--cubito-text-primary);
      }
      .diff-rail__row--modified .diff-rail__path,
      .diff-rail__row--added .diff-rail__path,
      .diff-rail__row--deleted .diff-rail__path,
      .diff-rail__row--renamed .diff-rail__path,
      .diff-rail__row--untracked .diff-rail__path {
        color: var(--cubito-text-primary);
      }
      .diff-rail__row--wt {
        border-left: 2px solid var(--cubito-amber-dim);
      }
      /* Directory truncates (from the end), the file name always stays whole. */
      .diff-rail__path {
        flex: 1;
        min-width: 0;
        display: flex;
        white-space: nowrap;
      }
      .diff-rail__dir {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .diff-rail__base {
        flex-shrink: 0;
      }
      .diff-rail__added,
      .diff-rail__removed {
        flex-shrink: 0;
      }
      .diff-rail__old-path {
        color: var(--cubito-text-faint);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .diff-rail__origin {
        color: var(--cubito-text-faint);
      }
      .diff-rail__added {
        color: var(--cubito-amber-ink);
      }
      .diff-rail__removed {
        color: var(--cubito-amber);
      }
      .cubito-diff-panel {
        position: absolute;
        left: 240px;
        /* The 3-line HUD ends ~70px; keep the first diff line clear of it (also #compare). */
        top: 84px;
        width: calc(100% - 240px);
        height: calc(100% - 84px);
        overflow-y: auto;
        font-family: 'Fira Code', 'SF Mono', ui-monospace, 'Cascadia Code', monospace;
        font-size: 12px;
        pointer-events: auto;
      }
      /* One column as wide as the longest line: the container scrolls, so a long line never wraps
         under the gutters and every row's tint spans the full scroll width. */
      .cubito-diff-panel__lines {
        display: grid;
        grid-template-columns: minmax(100%, max-content);
        overflow-x: auto;
      }
      .cubito-diff-panel__lines > div {
        display: grid;
        grid-template-columns: 60px 60px max-content;
      }
      .diff-panel__gutter {
        box-sizing: border-box;
        padding: 0 8px;
        text-align: right;
        color: var(--cubito-text-faint);
        user-select: none;
      }
      .diff-panel__text {
        white-space: pre;
        padding-left: 10px;
      }
      .diff-line--ctx {
        color: var(--cubito-text-dim);
      }
      .diff-line--add {
        color: var(--cubito-accent);
        background: color-mix(in srgb, var(--cubito-accent) 8%, transparent);
      }
      .diff-line--del {
        color: var(--cubito-amber);
        background: color-mix(in srgb, var(--cubito-amber) 8%, transparent);
      }
      .cubito-diff-panel__truncated,
      .cubito-diff-panel__binary,
      .cubito-diff-panel__loading,
      .cubito-diff-panel__idle,
      .cubito-diff-panel__error {
        padding: 14px 18px;
        color: var(--cubito-text-faint);
      }
      .cubito-diff-panel__error {
        color: var(--cubito-amber-ink);
      }
      /* Compare (design compare-side-panel) — a RIGHT-DOCKED side panel over the live 3D scene
         (design D1), not a full-screen mode: #app narrows instead of hiding. Mirrors #diff's
         rail+panel shape but adds a third column: the NEW child rail (litter overview), then
         diff mode's OWN file rail and panel, reused verbatim for the focused child. */
      #compare {
        position: fixed;
        inset: 0 0 0 auto;
        width: var(--cubito-compare-panel-width);
        overflow: hidden;
        pointer-events: none;
      }
      body[data-compare-panel='open'] #compare {
        pointer-events: auto; /* a stray click in the gutter must not reach OrbitControls */
        background: var(--cubito-panel-surface);
        border-left: 1px solid var(--cubito-panel-border);
      }
      /* The compare HUD is now the panel's own header, not a strip clearing two rails. */
      .cubito-compare-hud {
        position: absolute;
        inset: 12px 16px auto 16px;
        font-size: 12px;
        line-height: 1.6;
        pointer-events: none;
      }
      .cubito-compare-rail {
        position: absolute;
        left: 0;
        top: var(--cubito-compare-header-h);
        width: var(--cubito-compare-child-rail-w);
        height: calc(100% - var(--cubito-compare-header-h));
        overflow-y: auto;
        background: var(--cubito-panel-surface);
        border-right: 1px solid var(--cubito-panel-border);
        font-size: 11.5px;
        pointer-events: auto;
      }
      .cubito-compare-rail__empty {
        padding: 14px 16px;
        color: var(--cubito-text-faint);
      }
      .compare-rail__row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: 'label label' 'stat toggle';
        column-gap: 6px;
        row-gap: 4px;
        align-items: center;
        padding: 8px 14px;
        cursor: pointer;
        border-bottom: 1px solid var(--cubito-panel-border);
        color: var(--cubito-text-dim);
      }
      .compare-rail__row--focused {
        background: color-mix(in srgb, var(--cubito-info) 8%, transparent);
        color: var(--cubito-text-primary);
      }
      .compare-rail__row--error .compare-rail__label {
        color: var(--cubito-amber-ink);
      }
      .compare-rail__error {
        grid-column: 1 / -1;
        color: var(--cubito-amber-ink);
      }
      .compare-rail__label {
        grid-area: label;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .compare-rail__stat {
        grid-area: stat;
        min-width: 0;
        overflow-wrap: anywhere;
        color: var(--cubito-text-faint);
      }
      .compare-rail__winner-toggle {
        grid-area: toggle;
        white-space: nowrap;
        background: none;
        border: 1px solid var(--cubito-panel-border);
        color: var(--cubito-text-dim);
        font: inherit;
        padding: 2px 8px;
        cursor: pointer;
      }
      .compare-rail__row--winner .compare-rail__label,
      .compare-rail__row--winner .compare-rail__winner-toggle {
        color: var(--cubito-accent);
      }
      .compare-rail__row--winner .compare-rail__winner-toggle {
        border-color: var(--cubito-accent);
      }
      /* Compare reuses diff mode's own file-rail/panel elements — override their fixed
         left/width (set for #diff's two-column layout) so they sit in compare's third and
         fourth columns instead, below the panel's own header. */
      #compare .cubito-diff-rail {
        left: var(--cubito-compare-child-rail-w);
        width: var(--cubito-compare-file-rail-w);
        top: var(--cubito-compare-header-h);
        height: calc(100% - var(--cubito-compare-header-h));
      }
      #compare .cubito-diff-panel {
        left: calc(var(--cubito-compare-child-rail-w) + var(--cubito-compare-file-rail-w));
        width: calc(100% - var(--cubito-compare-child-rail-w) - var(--cubito-compare-file-rail-w));
        /* .cubito-diff-panel sets overflow-y only; `white-space: pre` diff lines need x too. */
        overflow: auto;
      }
      /* Winner-merge action (Change E) — sits over the file panel, bottom-right. */
      .cubito-compare-merge-action {
        position: absolute;
        right: 16px;
        bottom: 16px;
        width: min(320px, calc(100% - 32px));
        max-height: 40%;
        overflow-y: auto;
        pointer-events: auto;
        background: var(--cubito-panel-surface);
        border: 1px solid var(--cubito-panel-border);
        font-size: 11.5px;
      }
      .compare-merge-action__button {
        display: block;
        width: 100%;
        background: none;
        border: none;
        border-bottom: 1px solid var(--cubito-panel-border);
        color: var(--cubito-text-primary);
        font: inherit;
        text-align: left;
        padding: 10px 14px;
        cursor: pointer;
      }
      .compare-merge-action__button:disabled {
        color: var(--cubito-text-faint);
        cursor: default;
      }
      /* v3-2: opt-in parent working-tree sync toggle, between the button and the result region. */
      .compare-merge-action__sync {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--cubito-panel-border);
        color: var(--cubito-text-dim);
        cursor: pointer;
      }
      .compare-merge-action__result {
        padding: 0 14px;
      }
      .compare-merge-action__result-line {
        padding: 10px 0;
        color: var(--cubito-text-dim);
      }
      .compare-merge-action__result-line--clean {
        color: var(--cubito-accent);
      }
      .compare-merge-action__result-line--conflict,
      .compare-merge-action__result-line--warning,
      .compare-merge-action__result-line--error {
        color: var(--cubito-amber-ink);
      }
      .compare-merge-action__conflict-list {
        margin: 0 0 10px;
        padding: 0 0 0 16px;
        color: var(--cubito-text-dim);
      }
      /* Remove-worktree confirm (U1): centered in-app modal, same dim backdrop as the palette. */
      .cubito-worktree-delete {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
      }
      .cubito-worktree-delete[hidden] {
        display: none;
      }
      .cubito-worktree-delete__backdrop {
        position: absolute;
        inset: 0;
        background: color-mix(in srgb, var(--cubito-background) 70%, transparent);
      }
      .cubito-worktree-delete__card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: min(420px, calc(100% - 32px));
        padding: 18px;
        background: var(--cubito-panel-surface);
        border: 1px solid var(--cubito-panel-border);
        border-radius: 6px;
        font-size: 12.5px;
        color: var(--cubito-text-primary);
      }
      .cubito-worktree-delete__title {
        font-weight: 600;
      }
      .cubito-worktree-delete__lines {
        margin: 0;
        padding: 0 0 0 16px;
        color: var(--cubito-text-dim);
      }
      .cubito-worktree-delete__error {
        font-size: 11px;
        color: var(--cubito-amber);
      }
      .cubito-worktree-delete__actions {
        display: flex;
        gap: 8px;
      }
      .cubito-worktree-delete__action,
      .cubito-worktree-delete__cancel {
        flex: 1;
        height: 36px;
        border-radius: 4px;
        font: inherit;
        cursor: pointer;
      }
      .cubito-worktree-delete__action {
        border: none;
        background: var(--cubito-amber);
        color: var(--cubito-background);
        font-weight: 600;
      }
      .cubito-worktree-delete__cancel {
        border: 1px solid var(--cubito-panel-border);
        background: transparent;
        color: var(--cubito-text-dim);
      }
      .cubito-worktree-delete__action:disabled,
      .cubito-worktree-delete__cancel:disabled {
        opacity: 0.5;
        cursor: default;
      }
      /* File quick-open + file pane (U4): body-level overlays, visible over diff/system modes. */
      .cubito-file-quick-open,
      .cubito-file-editor {
        position: fixed;
        inset: 0;
        z-index: 25;
        display: flex;
        pointer-events: auto;
      }
      .cubito-file-quick-open[hidden],
      .cubito-file-editor[hidden] {
        display: none;
      }
      .cubito-file-quick-open {
        align-items: flex-start;
        justify-content: center;
        padding-top: 12vh;
      }
      .cubito-file-quick-open__backdrop {
        position: absolute;
        inset: 0;
        background: color-mix(in srgb, var(--cubito-background) 70%, transparent);
      }
      .cubito-file-quick-open__card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(560px, calc(100% - 32px));
        padding: 12px;
        background: var(--cubito-panel-surface);
        border: 1px solid var(--cubito-panel-border);
        border-radius: 6px;
        font-size: 12.5px;
        color: var(--cubito-text-primary);
      }
      .cubito-file-quick-open__query {
        height: 36px;
        padding: 0 12px;
        background: var(--cubito-background);
        border: 1px solid var(--cubito-panel-border);
        border-radius: 4px;
        color: var(--cubito-text-primary);
        font: inherit;
      }
      .cubito-file-quick-open__query:focus {
        outline: none;
        border-color: var(--cubito-accent);
      }
      .cubito-file-quick-open__status {
        font-size: 11px;
        color: var(--cubito-text-dim);
      }
      .cubito-file-quick-open__status--error {
        color: var(--cubito-amber);
      }
      .cubito-file-quick-open__rows {
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-height: 320px;
        overflow-y: auto;
      }
      .cubito-file-quick-open__row {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
      }
      .cubito-file-quick-open__row--highlighted {
        background: color-mix(in srgb, var(--cubito-accent) 22%, transparent);
      }
      .cubito-file-quick-open__folder {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11px;
        color: var(--cubito-text-dim);
      }
      .cubito-file-editor {
        align-items: stretch;
        justify-content: center;
        background: color-mix(in srgb, var(--cubito-background) 85%, transparent);
      }
      .cubito-file-editor__card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(1000px, 100%);
        padding: 16px;
        background: var(--cubito-panel-surface);
        border: 1px solid var(--cubito-panel-border);
        font-size: 12.5px;
        color: var(--cubito-text-primary);
      }
      .cubito-file-editor__header {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .cubito-file-editor__title {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
      }
      .cubito-file-editor__badge,
      .cubito-file-editor__message {
        font-size: 11px;
        color: var(--cubito-amber);
      }
      .cubito-file-editor__badge[hidden],
      .cubito-file-editor__message[hidden] {
        display: none;
      }
      .cubito-file-editor__close {
        height: 28px;
        padding: 0 12px;
        border: 1px solid var(--cubito-panel-border);
        border-radius: 4px;
        background: transparent;
        color: var(--cubito-text-dim);
        font: inherit;
        cursor: pointer;
      }
      .cubito-file-editor__text {
        flex: 1;
        min-height: 0;
        resize: none;
        padding: 10px;
        background: var(--cubito-background);
        border: 1px solid var(--cubito-panel-border);
        border-radius: 4px;
        color: var(--cubito-text-primary);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
        tab-size: 2;
        white-space: pre;
      }
      .cubito-file-editor__text:focus {
        outline: none;
        border-color: var(--cubito-accent);
      }
      .cubito-file-editor__dirty {
        color: var(--cubito-amber);
      }
      .cubito-file-editor__notice {
        font-size: 11px;
        color: var(--cubito-text-dim);
      }
      .cubito-file-editor__dirty[hidden],
      .cubito-file-editor__notice[hidden],
      .cubito-file-editor__bar[hidden],
      .cubito-file-editor__save[hidden] {
        display: none;
      }
      .cubito-file-editor__save {
        height: 28px;
        padding: 0 12px;
        border: none;
        border-radius: 4px;
        background: var(--cubito-accent);
        color: var(--cubito-background);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .cubito-file-editor__save:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .cubito-file-editor__bar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 10px;
        border: 1px solid var(--cubito-amber);
        border-radius: 4px;
      }
      .cubito-file-editor__bar-text {
        flex: 1;
        color: var(--cubito-amber);
      }
      .cubito-file-editor__bar-action {
        height: 28px;
        padding: 0 12px;
        border: none;
        border-radius: 4px;
        background: var(--cubito-amber);
        color: var(--cubito-background);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .cubito-file-editor__bar-action:disabled {
        opacity: 0.5;
        cursor: default;
      }
      /* Diff mode source control (U2): the commit composer sits under the file rail. */
      :root {
        --cubito-diff-composer-h: 176px;
        --cubito-diff-composer-review-h: 380px;
        /* #keyboard-bar is fixed bottom-left: bottom offset + chip height, kept clear of the composer. */
        --cubito-keyboard-bar-h: 40px;
      }
      #diff .cubito-diff-rail {
        height: calc(100% - var(--cubito-diff-composer-h) - var(--cubito-keyboard-bar-h));
      }
      #diff:has(.cubito-source-control--review) .cubito-diff-rail {
        height: calc(100% - var(--cubito-diff-composer-review-h) - var(--cubito-keyboard-bar-h));
      }
      .cubito-source-control--review {
        height: var(--cubito-diff-composer-review-h);
      }
      .cubito-source-control__review,
      .cubito-source-control__review-form {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .cubito-source-control__review[hidden],
      .cubito-source-control__review-form[hidden],
      .cubito-source-control__review [hidden] {
        display: none;
      }
      .cubito-source-control__review-title,
      .cubito-source-control__review-body {
        padding: 6px 8px;
        background: var(--cubito-background);
        border: 1px solid var(--cubito-panel-border);
        border-radius: 4px;
        color: var(--cubito-text-primary);
        font: inherit;
        resize: none;
      }
      .cubito-source-control__review-title:focus,
      .cubito-source-control__review-body:focus {
        outline: none;
        border-color: var(--cubito-accent);
      }
      .cubito-source-control__draft {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--cubito-text-dim);
      }
      .cubito-source-control__button--primary {
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        border-color: var(--cubito-accent);
        color: var(--cubito-accent);
        text-decoration: none;
      }
      .cubito-source-control__result-link {
        color: var(--cubito-accent);
      }
      .cubito-source-control {
        position: absolute;
        left: 0;
        bottom: var(--cubito-keyboard-bar-h);
        width: 240px;
        height: var(--cubito-diff-composer-h);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 10px;
        overflow-y: auto;
        background: var(--cubito-panel-surface);
        border-top: 1px solid var(--cubito-panel-border);
        border-right: 1px solid var(--cubito-panel-border);
        font-size: 11.5px;
        pointer-events: auto;
      }
      .cubito-source-control[hidden] {
        display: none;
      }
      .cubito-source-control__status {
        color: var(--cubito-text-dim);
      }
      .cubito-source-control__message {
        resize: none;
        padding: 6px 8px;
        background: var(--cubito-background);
        border: 1px solid var(--cubito-panel-border);
        border-radius: 4px;
        color: var(--cubito-text-primary);
        font: inherit;
      }
      .cubito-source-control__message:focus {
        outline: none;
        border-color: var(--cubito-accent);
      }
      .cubito-source-control__actions {
        display: flex;
        gap: 6px;
      }
      .cubito-source-control__button {
        flex: 1;
        height: 28px;
        border: 1px solid var(--cubito-panel-border);
        border-radius: 4px;
        background: transparent;
        color: var(--cubito-text-primary);
        font: inherit;
        cursor: pointer;
      }
      .cubito-source-control__button:not(:disabled):hover {
        border-color: var(--cubito-accent);
      }
      .cubito-source-control__button:disabled {
        color: var(--cubito-text-faint);
        cursor: default;
      }
      .cubito-failure__detail {
        display: block;
        margin-top: 2px;
        font-size: 0.92em;
        color: var(--cubito-text-faint);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
      }
      .cubito-source-control__notice--ok {
        color: var(--cubito-accent);
      }
      .cubito-source-control__notice--error {
        color: var(--cubito-amber-ink);
      }
      .diff-rail__stage {
        order: -1;
        width: 18px;
        padding: 0;
        border: none;
        background: none;
        color: var(--cubito-text-dim);
        font: inherit;
        cursor: pointer;
      }
      .diff-rail__stage--staged {
        color: var(--cubito-accent);
      }
    </style>
  </head>

    <div id="vignette"></div>
    <div id="hud"></div>
    <div id="system">
      <div id="system-graph-viewport" class="cubito-system-graph-viewport"></div>
    </div>
    <div id="diff"></div>
    <div id="compare"></div>
    <div id="keyboard-bar"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
